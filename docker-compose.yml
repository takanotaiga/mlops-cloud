version: "3.9"

services:
  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  database:
    image: surrealdb/surrealdb:v2.3
    user: "0:0"
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-data:/data
    command: start --user root --pass root file:/data/db
    restart: unless-stopped

  cloud-ui:
    image: ghcr.io/takanotaiga/mlops-cloud-ui:sha-72c9a11
    depends_on:
      - database
      - object-storage
    environment:
      # Public (client) envs used in the browser
      NEXT_PUBLIC_SURREAL_URL: ws://database:8000/rpc
      NEXT_PUBLIC_SURREAL_NS: mlops
      NEXT_PUBLIC_SURREAL_DB: cloud_ui
      NEXT_PUBLIC_SURREAL_USER: root
      NEXT_PUBLIC_SURREAL_PASS: root

      # Server-side Surreal connection
      SURREAL_URL: ws://database:8000/rpc
      SURREAL_NS: mlops
      SURREAL_DB: cloud_ui
      SURREAL_USER: root
      SURREAL_PASS: root

      # Server-side MinIO/S3 connection
      MINIO_ENDPOINT_INTERNAL: http://object-storage:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET: mlops-datasets
      MINIO_FORCE_PATH_STYLE: "true"

      # Use PutObject below this size (bytes); above uses multipart
      S3_MULTIPART_THRESHOLD_BYTES: "1000000000"

    ports:
      - "3000:3000"
    restart: unless-stopped

  mlx-backend:
    image: taigatakano/mlops-cloud-backend-mlx:v1.5
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu", "video"]
    shm_size: 32G
    tty: true
    depends_on:
      - database
      - object-storage
    environment:
      SURREAL_URL: ws://database:8000/rpc
      SURREAL_NS: mlops
      SURREAL_DB: cloud_ui
      SURREAL_USER: root
      SURREAL_PASS: root
      MINIO_ENDPOINT_INTERNAL: http://object-storage:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET: mlops-datasets
      MINIO_FORCE_PATH_STYLE: "true"
      S3_MULTIPART_THRESHOLD_BYTES: "1000000000"
      POLL_INTERVAL: "5"
    restart: unless-stopped

  cv-backend:
    image: ghcr.io/takanotaiga/mlops-cloud-backend-cv:sha-218e6d6
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu", "video"]
    shm_size: 32G
    depends_on:
      - database
      - object-storage
    environment:
      SURREAL_URL: ws://database:8000/rpc
      SURREAL_NS: mlops
      SURREAL_DB: cloud_ui
      SURREAL_USER: root
      SURREAL_PASS: root
      MINIO_ENDPOINT_INTERNAL: http://object-storage:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET: mlops-datasets
      MINIO_FORCE_PATH_STYLE: "true"
      S3_MULTIPART_THRESHOLD_BYTES: "1000000000"
      POLL_INTERVAL: "5"
    restart: unless-stopped

  hm-backend:
    image: ghcr.io/takanotaiga/mlops-cloud-backend-hm:sha-9b95a61
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    shm_size: 32G
    depends_on:
      - database
      - object-storage
    environment:
      SURREAL_URL: ws://database:8000/rpc
      SURREAL_NS: mlops
      SURREAL_DB: cloud_ui
      SURREAL_USER: root
      SURREAL_PASS: root
    restart: unless-stopped

  cm-backend:
    image: ghcr.io/takanotaiga/mlops-cloud-backend-cm:sha-218e6d6
    shm_size: 32G
    depends_on:
      - database
      - object-storage
    environment:
      SURREAL_URL: ws://database:8000/rpc
      SURREAL_NS: mlops
      SURREAL_DB: cloud_ui
      SURREAL_USER: root
      SURREAL_PASS: root
      MINIO_ENDPOINT_INTERNAL: http://object-storage:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET: mlops-datasets
      MINIO_FORCE_PATH_STYLE: "true"
      S3_MULTIPART_THRESHOLD_BYTES: "1000000000"
      POLL_INTERVAL: "5"
    restart: unless-stopped

volumes:
  minio-data:
  surrealdb-data:
