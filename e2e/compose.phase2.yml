services:
  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs:
      - /data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  database:
    image: surrealdb/surrealdb:v2.3
    user: "0:0"
    command: start --user root --pass root memory
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend-test:
    image: mlops-cloud-backend-base:phase2
    pull_policy: build
    build:
      context: ../../mlops-cloud-backend
      dockerfile: Dockerfile.base
    depends_on:
      - database
      - object-storage
    environment:
      SURREAL_URL: ws://database:8000/rpc
      SURREAL_NS: mlops_phase2
      SURREAL_DB: cloud_backend
      SURREAL_USER: root
      SURREAL_PASS: root
      MINIO_ENDPOINT_INTERNAL: http://object-storage:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET: mlops-phase2
      MINIO_FORCE_PATH_STYLE: "true"
      S3_MULTIPART_THRESHOLD_BYTES: "1000000000"
      POLL_INTERVAL: "0"
    volumes:
      - ./phase2:/app/tests_phase2:ro
    command:
      - sh
      - -lc
      - |
          set -eu
          uv pip install pytest
          uv run pytest -q tests_phase2
